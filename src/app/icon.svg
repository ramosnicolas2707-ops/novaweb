<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!--
    FAVICON — la N de NovaWeb reducida a lo que sobrevive a 16 píxeles.

    Se le cae el circuito a propósito. Los canales del logo miden 1 de 40; en
    esta caja, ya encogida la letra, quedan en 0,6, y a 16 px eso es un cuarto
    de píxel: no se ve como circuito, se ve como suciedad sobre la N. Lo que
    sí aguanta es un nodo, y con ese basta para que no sea una N cualquiera.

    El cuadro naranja tampoco está en el logo grande, y aquí sí. Un favicon
    vive en una pestaña que puede ser blanca o negra según el tema del
    navegador: una letra suelta desaparece en uno de los dos, y el cuadro le
    garantiza su propio fondo siempre.

    Las dos versiones del logo y por qué son distintas:
      · marca    src/components/Logo.tsx  <Isotipo>   28 px para arriba, con circuito
      · favicon  este archivo                         16-32 px, letra y un nodo

    Si cambias la N, cámbiala en las dos.
  -->
  <rect x="3" y="3" width="34" height="34" rx="11.5" fill="#ff5a00"/>
  <g transform="translate(11.65 10.4) scale(0.62) translate(-6.5 -4.5)">
    <path d="M6.5 4.5 L13.5 4.5 L26.5 21 L26.5 4.5 L33.5 4.5 L33.5 35.5 L26.5 35.5 L13.5 19 L13.5 35.5 L6.5 35.5 Z"
          fill="#0d0d0d" stroke="#0d0d0d" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <circle cx="26.2" cy="12.9" r="1.7" fill="#ffffff"/>
</svg>
