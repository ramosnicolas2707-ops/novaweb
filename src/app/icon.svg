<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!--
    FAVICON — la N de NovaWeb reducida a lo que sobrevive a 16 píxeles.

    Se le caen las pistas doradas a propósito. A 16 px una línea de 1,8 mide
    0,7 píxeles: no se ve como pista, se ve como suciedad sobre la N. Lo que
    sí aguanta es un solo nodo, y con ese basta para que se lea como circuito
    y no como una N cualquiera.

    Los otros dos ajustes van en la misma dirección: el cuadro casi llena la
    caja (borde de 3) y la N engorda a 5,2, porque en un favicon cada píxel
    de grosor cuenta.

    Las dos versiones del logo y por qué son distintas:
      · marca    src/components/Logo.tsx  <Isotipo>   24-48 px, con pistas
      · favicon  este archivo                         16-32 px, solo un nodo

    Si cambias la N, cámbiala en las dos.
  -->
  <rect x="3" y="3" width="34" height="34" rx="11.5" fill="#ff5a00"/>
  <path d="M12.5 28.5 L12.5 12 L27.5 28.5 L27.5 12"
        fill="none" stroke="#0d0d0d" stroke-width="5.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="27.5" cy="14.6" r="2" fill="#eab765"/>
</svg>
