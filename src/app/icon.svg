<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!--
    FAVICON — la N de NovaWeb, la misma de src/components/Logo.tsx.

    Lleva un cuadro blanco detrás que el logo grande no tiene. Un favicon vive
    en una pestaña que puede ser clara u oscura según el tema del navegador:
    sobre una pestaña oscura, las astas negras desaparecerían. El cuadro le
    garantiza su propio fondo siempre.

    Si cambias la N, cámbiala también en Logo.tsx, en src/lib/og.tsx y en Marketing/.
  -->
  <rect x="0" y="0" width="40" height="40" rx="9" fill="#ffffff"/>
  <rect x="5" y="5" width="8" height="30" fill="#0d0d0d"/>
  <rect x="27" y="5" width="8" height="30" fill="#0d0d0d"/>
  <polygon points="5,5 13,5 35,35 27,35" fill="#b00000"/>
</svg>
